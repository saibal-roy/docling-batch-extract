name: CI

# Lint, guard against committed documents, then provision a real Ubuntu runner with
# scripts/setup_ubuntu.sh and run the acceptance suite against the live docling container.
# Benchmarks (~25 min) run only when started by hand with "benchmarks" ticked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Also run the benchmarks (tests/run_acceptance.sh --bench-only)"
        type: boolean
        default: false
  workflow_call:   # reused by release.yml: a release only happens after the full CI passes
    inputs:
      benchmarks:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and data guard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: No documents or outputs committed
        run: |
          # Client documents must never reach the repository (see .gitignore).
          # Data folders may only contain their own .gitignore.
          # The only PDFs allowed are public demo files listed (with license) in scripts/demo-files/README.md.
          bad=$(git ls-files | grep -iE '\.pdf$|^(inputs?|outputs?|completed|errors|logs|tests/fixtures|tests/work)/' \
                | grep -vE '^(inputs|outputs|completed|errors|logs|tests/fixtures)/\.gitignore$' \
                | grep -vE '^scripts/demo-files/[^/]+\.pdf$' || true)
          if [ -n "$bad" ]; then echo "::error::Data files are tracked:"; echo "$bad"; exit 1; fi
          for f in $(git ls-files 'scripts/demo-files/*.pdf'); do
            grep -q "\`$(basename "$f")\`" scripts/demo-files/README.md \
              || { echo "::error::$f is not listed with its license in scripts/demo-files/README.md"; exit 1; }
          done

      - name: Python lint (ruff)
        run: |
          pip install ruff==0.16.10
          ruff check .

      - name: Python compiles
        run: python -m py_compile extract.py tests/*.py

      - name: Shell lint (shellcheck)
        run: shellcheck -S warning scripts/*.sh tests/*.sh

      - name: docker-compose.yml is valid
        run: docker compose config --quiet

  acceptance:
    name: Setup + acceptance (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]   # policy: only the latest Ubuntu LTS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for the ~5 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null

      - name: Runner resources
        run: |
          nproc; free -g; df -h .
          docker --version; docker compose version
          # Results committed in the repo are records; this run writes its own.
          echo "RESULTS_BEFORE=$(find tests/results -mindepth 1 -maxdepth 1 -type d -printf '%f ')" >> "$GITHUB_ENV"

      - name: Provision with scripts/setup_ubuntu.sh
        run: scripts/setup_ubuntu.sh --cron-minutes 5

      - name: Setup script results
        run: |
          curl -sf localhost:5001/health
          docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' docling_ocr_worker_cpu
          test -x .venv/bin/python
          for d in inputs outputs completed errors logs; do test -d "$d"; done
          crontab -l | grep -q '# docling-batch-extract'

      - name: Setup script is safe to run again (no duplicate cron entry)
        run: |
          scripts/setup_ubuntu.sh --cron-minutes 5
          test "$(crontab -l | grep -c '# docling-batch-extract')" -eq 1

      - name: Remove cron entry before testing
        # The cron job would compete with the tests for the container.
        run: crontab -l | grep -v '# docling-batch-extract' | crontab - || true

      - name: Smoke test (real inputs/ → outputs/ → completed/)
        run: |
          .venv/bin/pip install -q -r tests/requirements.txt
          .venv/bin/python tests/make_test_pdfs.py /tmp/pdfs
          cp /tmp/pdfs/small_a.pdf /tmp/pdfs/bad.pdf inputs/
          rc=0; .venv/bin/python extract.py || rc=$?
          test "$rc" -eq 1                       # bad.pdf failed, everything else succeeded
          test -f outputs/small_a.json && test -f completed/small_a.pdf && test -f errors/bad.pdf
          test -f logs/small_a.log && test -f logs/bad.log
          python3 -c "import json; d = json.load(open('outputs/small_a.json')); assert d['pages'] == 3 and d['markdown'].strip()"

      - name: Cleanup script
        run: |
          scripts/cleanup.sh --dry-run
          scripts/cleanup.sh --inputs -y
          for d in inputs outputs completed errors logs; do
            test -f "$d/.gitignore"                                  # kept so the folder stays in git
            test -z "$(find "$d" -mindepth 1 ! -name .gitignore)"    # everything else removed
          done

      - name: First demo run (scripts/demo_run.sh)
        run: |
          scripts/demo_run.sh --clean-after
          cat logs/demo-benchmark-*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Acceptance checks
        run: tests/run_acceptance.sh --quick

      - name: Benchmarks
        if: ${{ inputs.benchmarks }}
        run: tests/run_acceptance.sh --bench-only

      - name: Collect this run's results
        if: always()
        run: |
          mkdir -p /tmp/ci-results
          for d in tests/results/*/; do
            name=$(basename "$d")
            case " $RESULTS_BEFORE " in *" $name "*) continue ;; esac
            cp -r "$d" /tmp/ci-results/
            cat "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Container logs on failure
        if: failure()
        run: docker logs --tail 200 docling_ocr_worker_cpu || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: /tmp/ci-results/
          if-no-files-found: ignore
