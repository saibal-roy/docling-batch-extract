name: Pages

# Build the documentation site exactly as scripts/preview_site.sh does locally, check it, deploy it.
# Runs on every push to main. One-time repository setting: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]   # every push to main rebuilds, checks and deploys the site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Build (strict)
        run: |
          pip install -r docs/requirements.txt
          python scripts/build_site.py
          mkdocs build --strict

      - name: Check links, anchors and assets under the Pages subpath
        run: |
          mkdir -p /tmp/pages && cp -r site /tmp/pages/docling-batch-extract
          python -m http.server 8080 --directory /tmp/pages >/dev/null 2>&1 &
          sleep 1
          python scripts/check_site.py http://localhost:8080/docling-batch-extract/

      - name: No PDFs or data on the site
        run: |
          bad=$(find site -iname '*.pdf' -o -iname '*.json' ! -path 'site/search/*' | grep -v '^site/search/' || true)
          if [ -n "$bad" ]; then echo "::error::Unexpected files on the site:"; echo "$bad"; exit 1; fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
