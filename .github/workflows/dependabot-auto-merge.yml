name: Dependabot auto-merge

# Dependabot opens pull requests every night (.github/dependabot.yml). Patch and minor updates,
# including security fixes, are set to merge automatically; GitHub merges them only after the
# required CI checks pass (ruleset "Require CI"). Major updates are left open for review.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge once CI passes (patch and minor)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR"

      - name: Leave major updates for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR" --body "Major update: not merged automatically. Check the release notes and the project's LTS policy, run the full checks, then merge by hand."
